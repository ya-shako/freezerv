<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Холодильник</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Мой холодильник</h1>
        
        <!-- Две вкладки -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('scan')">📷 Сканер</button>
            <button class="tab-btn" onclick="showTab('list')">📋 Список</button>
        </div>
        
        <!-- Вкладка Сканер -->
        <div id="scanTab" class="tab-content active">
            <div id="reader" style="width: 100%; max-width: 500px; margin: 0 auto;"></div>
            <button id="scanBtn" class="btn btn-primary">Начать сканирование</button>
            <div id="scanResult" class="result"></div>
        </div>
        
        <!-- Вкладка Список -->
        <div id="listTab" class="tab-content">
            <div class="controls">
                <button id="refreshBtn" class="btn">🔄 Обновить</button>
            </div>
            <div id="productsList" class="products-grid">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
    </div>
    
    <script src="/app.js"></script>
    <script>
        let scanner = null;
        
        function showTab(tab) {
            // Переключение вкладок
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if (tab === 'scan') {
                document.getElementById('scanTab').classList.add('active');
                document.querySelector('.tab-btn:first-child').classList.add('active');
            } else {
                document.getElementById('listTab').classList.add('active');
                document.querySelector('.tab-btn:last-child').classList.add('active');
                loadProducts();
            }
        }
        
        // Сканер
        const scanBtn = document.getElementById('scanBtn');
        const scanResult = document.getElementById('scanResult');
        
        scanBtn.onclick = () => {
            if (scanner) {
                scanner.stop();
            }
            
            scanner = new Html5Qrcode("reader");
            
            scanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                async (barcode) => {
                    scanResult.innerHTML = "⏳ Отправка...";
                    
                    const response = await apiRequest("/api/scan", "POST", { barcode: barcode });
                    
                    if (response.ok) {
                        const data = await response.json();
                        scanResult.innerHTML = `✅ Добавлено: ${data.product_name}`;
                        loadProducts(); // обновляем список в фоне
                    } else {
                        scanResult.innerHTML = "❌ Ошибка";
                    }
                    
                    scanner.stop();
                    scanner = null;
                    setTimeout(() => { scanResult.innerHTML = ""; }, 3000);
                },
                (error) => { console.error(error); }
            ).catch(err => {
                scanResult.innerHTML = "❌ Не удалось запустить камеру";
            });
        };
        
        // Список продуктов
        async function loadProducts() {
            const productsDiv = document.getElementById('productsList');
            productsDiv.innerHTML = '<div class="loading">Загрузка...</div>';
            
            const response = await apiRequest("/api/products");
            if (response.ok) {
                const products = await response.json();
                renderProducts(products);
            } else {
                productsDiv.innerHTML = '<div class="error">Ошибка</div>';
            }
        }
        
        function renderProducts(products) {
            const productsDiv = document.getElementById('productsList');
            
            if (products.length === 0) {
                productsDiv.innerHTML = '<div class="empty">Холодильник пуст</div>';
                return;
            }
            
            productsDiv.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-name">${escapeHtml(p.name)}</div>
                    <div class="product-brand">${p.brand || ''}</div>
                    <div class="product-expires">📅 ${p.expires_at || 'срок не указан'}</div>
                    <div class="product-quantity">📦 ${p.quantity}</div>
                    <button class="btn-delete" onclick="deleteProduct(${p.id})">🗑 Удалить</button>
                </div>
            `).join('');
        }
        
        async function deleteProduct(id) {
            if (confirm('Удалить продукт?')) {
                await apiRequest(`/api/products/${id}`, 'DELETE');
                loadProducts();
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        document.getElementById('refreshBtn').onclick = loadProducts;
        
        // При загрузке показываем список
        loadProducts();
    </script>
</body>
</html>
