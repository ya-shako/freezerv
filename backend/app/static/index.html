<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Холодильник</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Мой холодильник</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('scan')">📷 Сканер</button>
            <button class="tab-btn" onclick="showTab('list')">📋 Список</button>
        </div>
        
        <div id="scanTab" class="tab-content active">
            <div id="reader" style="width: 100%; max-width: 500px; margin: 0 auto;"></div>
            <div id="scanResult" class="result"></div>
        </div>
        
        <div id="listTab" class="tab-content">
            <div class="controls">
                <button id="refreshBtn" class="btn">🔄 Обновить</button>
            </div>
            <div id="productsList" class="products-grid">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
    </div>
    
    <script src="/app.js"></script>
	<div id="debug-panel" style="position:fixed; bottom:0; left:0; right:0; background:#000; color:#0f0; font-size:12px; padding:8px; max-height:150px; overflow-y:auto; z-index:9999; font-family:monospace; border-top:2px solid #0f0;"></div>

<script>
    const debugPanel = document.getElementById('debug-panel');
    
    // Перехватываем все ошибки
    window.onerror = function(msg, url, line) {
        debugPanel.innerHTML += `<div style="color:#f00;">❌ ${msg} (${url}:${line})</div>`;
        return false;
    };
    
    // Перехватываем console.error
    const oldError = console.error;
    console.error = function(...args) {
        debugPanel.innerHTML += `<div style="color:#f66;">⚠️ ${args.join(' ')}</div>`;
        oldError.apply(console, args);
    };
    
    // Перехватываем console.log
    const oldLog = console.log;
    console.log = function(...args) {
        debugPanel.innerHTML += `<div style="color:#aaa;">📢 ${args.join(' ')}</div>`;
        oldLog.apply(console, args);
    };
    
    // Показываем статус камеры
    navigator.mediaDevices.enumerateDevices()
        .then(devices => {
            const cameras = devices.filter(d => d.kind === 'videoinput');
            debugPanel.innerHTML += `<div style="color:#0f0;">✅ Найдено камер: ${cameras.length}</div>`;
            if (cameras.length === 0) {
                debugPanel.innerHTML += `<div style="color:#f00;">❌ Камеры не найдены на этом устройстве!</div>`;
            }
        })
        .catch(err => {
            debugPanel.innerHTML += `<div style="color:#f00;">❌ Ошибка доступа к медиа: ${err.message}</div>`;
        });
</script>
</body>
</html>
